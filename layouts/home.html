{{- define "main" }}
<section class="directory" aria-labelledby="page-title">
    <div class="directory__heading">
        <span aria-hidden="true">01—06</span>
        <h1 id="page-title">{{ .Title }}</h1>
    </div>

    <ol class="directory__list">
        {{- range $index, $item := site.Menus.main }}
        <li>
            <a href="{{ $item.URL | relLangURL }}"{{ if $.IsMenuCurrent "main" $item }} aria-current="page"{{ end }}>
                <span class="directory__number">{{ printf "%02d" (add $index 1) }}</span>
                <span class="directory__name">{{ $item.Name }}</span>
                <span class="directory__mark" aria-hidden="true">↗</span>
            </a>
        </li>
        {{- end }}
    </ol>
</section>
{{- end }}
