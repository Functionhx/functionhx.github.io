<header class="site-header">
    <div class="site-header__inner">
        <a class="site-title" href="{{ "" | relLangURL }}">{{ site.Title }}</a>

        <nav class="site-nav" id="menu" aria-label="{{ site.Params.ui.navLabel }}">
            {{- $current := . }}
            {{- range site.Menus.main }}
            <a href="{{ .URL | relLangURL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>
                {{- .Name -}}
            </a>
            {{- end }}
        </nav>

        <div class="site-controls">
            {{- range .Translations }}
            <a class="language-switch" href="{{ .RelPermalink }}" hreflang="{{ .Language.Locale }}" aria-label="{{ site.Params.ui.switchLanguage }}">
                {{- if eq .Lang "en" }}EN{{ else }}中{{ end -}}
            </a>
            {{- end }}
            <button id="theme-toggle" type="button" aria-label="{{ site.Params.ui.themeLabel }}" title="{{ site.Params.ui.themeLabel }}">
                <span aria-hidden="true">◐</span>
            </button>
        </div>
    </div>
</header>
