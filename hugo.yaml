baseURL: https://functionhx.github.io/
title: Yuchen Fan
theme: PaperMod
defaultContentLanguage: zh-cn
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
timeZone: Asia/Shanghai

pagination:
  pagerSize: 12

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
  category: categories

params:
  defaultTheme: auto
  disableThemeToggle: false
  disableScrollToTop: true
  hideFooter: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowReadingTime: true
  ShowShareButtons: false
  comments: false
  searchEnabled: false
  cmsEnabled: false
  legacyInteractions: false
  critiquesEnabled: false
  fxEnabled: false
  assets:
    favicon: /favicon.svg
    favicon16x16: /favicon.svg
    favicon32x32: /favicon.svg
    apple_touch_icon: /favicon.svg
    safari_pinned_tab: /favicon.svg
    theme_color: "#f3f1eb"
    msapplication_TileColor: "#f3f1eb"

