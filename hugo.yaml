baseURL: https://functionhx.github.io/
title: Sections
theme: PaperMod
defaultContentLanguage: zh-cn
defaultContentLanguageInSubdir: false
disableAliases: true
disableKinds:
  - taxonomy
  - term
  - RSS
  - sitemap
  - robotsTXT
  - "404"

outputs:
  home:
    - HTML

params:
  defaultTheme: auto
  disableThemeToggle: false
  disableScrollToTop: true
  hideFooter: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowPostNavLinks: false
  ShowReadingTime: false
  ShowShareButtons: false
  comments: false
  assets:
    favicon: /favicon.svg
    favicon16x16: /favicon.svg
    favicon32x32: /favicon.svg
    apple_touch_icon: /favicon.svg
    safari_pinned_tab: /favicon.svg
    theme_color: "#f1f0eb"
    msapplication_TileColor: "#f1f0eb"

languages:
  zh-cn:
    locale: zh-CN
    label: 中文
    weight: 1
    contentDir: content/zh
    title: 栏目
    params:
      ui:
        navLabel: 栏目
        switchLanguage: Switch to English
        themeLabel: 切换白天或黑夜模式
    menus:
      main:
        - identifier: home
          name: 首页
          pageRef: /
          weight: 10
        - identifier: projects
          name: 项目
          pageRef: /projects
          weight: 20
        - identifier: research
          name: 研究
          pageRef: /research
          weight: 30
        - identifier: open-source
          name: 开源
          pageRef: /open-source
          weight: 40
        - identifier: notes
          name: 笔记
          pageRef: /notes
          weight: 50
        - identifier: about
          name: 关于
          pageRef: /about
          weight: 60
  en:
    locale: en-US
    label: English
    weight: 2
    contentDir: content/en
    title: Sections
    params:
      ui:
        navLabel: Sections
        switchLanguage: 切换到中文
        themeLabel: Toggle light or dark mode
    menus:
      main:
        - identifier: home
          name: Home
          pageRef: /
          weight: 10
        - identifier: projects
          name: Projects
          pageRef: /projects
          weight: 20
        - identifier: research
          name: Research
          pageRef: /research
          weight: 30
        - identifier: open-source
          name: Open Source
          pageRef: /open-source
          weight: 40
        - identifier: notes
          name: Notes
          pageRef: /notes
          weight: 50
        - identifier: about
          name: About
          pageRef: /about
          weight: 60
