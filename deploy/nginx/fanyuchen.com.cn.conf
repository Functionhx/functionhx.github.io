# Build output references static files as /assets/...?v=<content hash> (Jekyll bust_file_cache),
# so a URL with ?v= can never change content: cache it for a year. Without ?v= the file may change
# under the same URL, so the browser must revalidate.
map $arg_v $functionhx_asset_cache {
    default "public, max-age=31536000, immutable";
    ""      "no-cache";
}

# Images and fonts rarely change, so unversioned ones keep the old 7-day cache.
map $arg_v $functionhx_media_cache {
    default "public, max-age=31536000, immutable";
    ""      "public, max-age=604800";
}

# 无头主页（_plugins/headless_site.rb）的内容协商：同一个网址，按访客类型返回不同格式。
#   Accept: text/markdown             → 该页的 Markdown 版（<页面>index.html.md）
#   Accept: application/json 访问 /   → /api/profile.json
#   curl / wget / HTTPie / xh（没有声明要 HTML）→ 首页返回彩色名片 /cli，其他页面返回 Markdown 版
#   其余（浏览器、搜索引擎）           → HTML，不变
map $http_accept $functionhx_accept {
    default                 "";
    "~*text/markdown"       markdown;
    "~*application/json"    json;
    "~*text/html"           html;
}
map $http_user_agent $functionhx_cli_client {
    default                         0;
    "~*^(curl|wget|httpie|xh)/"     1;
}
map "$functionhx_accept:$functionhx_cli_client" $functionhx_variant {
    default         html;
    "~^markdown:"   markdown;
    "~^json:"       json;
    ":1"            cli;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fanyuchen.com.cn www.fanyuchen.com.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    # Preserve the existing WeCom callback while redirecting the public site.
    location /wxcomapp/ {
        proxy_pass http://127.0.0.1:9898;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 终端访客常直接敲 `curl fanyuchen.com.cn`（默认 http）：重定向对 curl 来说只是一行空输出，
    # 所以命令行客户端访问首页时直接给彩色名片，其余一律跳 https。
    location = / {
        if ($functionhx_cli_client) {
            rewrite ^ /cli last;
        }
        return 301 https://fanyuchen.com.cn$request_uri;
    }

    location = /cli {
        root /var/www/functionhx/current;
        default_type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    location / {
        return 301 https://fanyuchen.com.cn$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name www.fanyuchen.com.cn;

    ssl_certificate /etc/letsencrypt/live/fanyuchen.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fanyuchen.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://fanyuchen.com.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fanyuchen.com.cn;

    root /var/www/functionhx/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/fanyuchen.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fanyuchen.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/markdown text/x-python text/css application/javascript application/json application/manifest+json image/svg+xml text/xml application/xml application/rss+xml;

    server_tokens off;

    # Security headers (see functionhx-security-headers.conf). Every location below that sets its
    # own add_header must include the snippet again, or nginx silently drops these headers there.
    include /etc/nginx/snippets/functionhx-security-headers.conf;

    location /wxcomapp/ {
        proxy_pass http://127.0.0.1:9898;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz.json {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/functionhx-security-headers.conf;
        try_files $uri =404;
    }

    location ^~ /api/magic-search/ {
        proxy_pass http://127.0.0.1:8790/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        # 内容协商（map 见文件开头）。只用 rewrite … last，是 nginx 里 if 唯一安全的用法。
        if ($functionhx_variant = cli) {
            rewrite ^/$ /cli last;
        }
        if ($functionhx_variant = json) {
            rewrite ^/$ /api/profile.json last;
        }
        set $functionhx_leaf "";
        if ($functionhx_variant ~ ^(markdown|cli)$) {
            set $functionhx_leaf "${uri}index.html.md";
        }
        if (-f $document_root$functionhx_leaf) {
            rewrite ^ $functionhx_leaf last;
        }
        try_files $uri $uri/ $uri.html =404;
    }

    # 无头主页的纯文本文件：明确 UTF-8，且同一网址会按 Accept / User-Agent 返回不同格式。
    location = /cli {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache";
        add_header Vary "Accept, User-Agent";
        include /etc/nginx/snippets/functionhx-security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(?:md|txt|py)$ {
        types {
            text/markdown md;
            text/plain txt;
            text/x-python py;
        }
        charset utf-8;
        charset_types text/markdown text/plain text/x-python;
        add_header Cache-Control "no-cache";
        add_header Vary "Accept, User-Agent";
        include /etc/nginx/snippets/functionhx-security-headers.conf;
        try_files $uri =404;
    }

    # Unversioned executable/style assets are revalidated so editor updates take effect immediately
    # (browsers can still reuse an unchanged response after the conditional request); versioned
    # ones (?v=<hash>) are immutable, see the map at the top of this file.
    location ~* \.(?:css|js|mjs)$ {
        add_header Cache-Control $functionhx_asset_cache;
        include /etc/nginx/snippets/functionhx-security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|ico|svg|woff|woff2|ttf|pdf|mp4|webm|vtt)$ {
        add_header Cache-Control $functionhx_media_cache;
        include /etc/nginx/snippets/functionhx-security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(?:html|json|xml)$ {
        add_header Cache-Control "no-cache";
        add_header Vary "Accept, User-Agent";
        include /etc/nginx/snippets/functionhx-security-headers.conf;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
