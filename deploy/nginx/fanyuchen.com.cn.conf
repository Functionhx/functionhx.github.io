server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fanyuchen.com.cn www.fanyuchen.com.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    # Preserve the existing WeCom callback while redirecting the public site.
    location /wxcomapp/ {
        proxy_pass http://127.0.0.1:9898;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 301 https://fanyuchen.com.cn$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name www.fanyuchen.com.cn;

    ssl_certificate /etc/letsencrypt/live/fanyuchen.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fanyuchen.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://fanyuchen.com.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fanyuchen.com.cn;

    root /var/www/functionhx/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/fanyuchen.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fanyuchen.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Site-Node "tencent-cvm" always;

    location /wxcomapp/ {
        proxy_pass http://127.0.0.1:9898;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz.json {
        add_header Cache-Control "no-store" always;
        add_header X-Site-Node "tencent-cvm" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|avif|ico|svg|woff|woff2|ttf|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Site-Node "tencent-cvm" always;
        try_files $uri =404;
    }

    location ~* \.(?:html|json|xml)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        add_header X-Site-Node "tencent-cvm" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
