# Install as /etc/nginx/snippets/functionhx-security-headers.conf (fanyuchen.com.cn.conf includes it).
#
# nginx drops every server-level add_header in a location that declares its own add_header, so the
# site config includes this file in the server block AND in each location that sets Cache-Control.
# Without that, HTML/CSS/JS responses went out with none of these headers.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# A <meta> CSP cannot carry frame-ancestors; this header only adds that one directive, the page's
# own CSP (head.liquid) still governs everything else.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Site-Node "tencent-cvm" always;
