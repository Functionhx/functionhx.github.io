# ƒ-01：本站原住民（原创角色，不使用任何公司的标志）。设定母版：assets/pet/f01/source/character-brief.md
id: f01
name: ƒ-01
company: 本站原住民
tagline: 网站自己长出来的函数生命体，这里的房东
color: "#1e5bd8"
# 内置占位形象的配色（授权形象登记后不再使用）。
palette: { skin: "#4f8ff7", skin_deep: "#1e5bd8", line: "#173f9e", belly: "#e6f4ff", accent: "#29d3e6" }
# 它的招牌动作：思考时展开成数据流；闲着时偶尔做的小动作。
moves:
  think: unfold
  quirks: [unfold, wave]
# 授权形象清单（assets/pet/f01/pet.json，见 assets/pet/README.md）。为空时用内置占位形象。
sprites:

greet:
  first:
    - 你是来看站长的，还是来看我的？
    - ……别盯着我看。我只是一段普通的 JavaScript。
    - 新面孔。我是 {name}，这里的房东。
  return:
    - 你回来了。我没有一直等，只是刚好还在这里。
    - 第 {visits} 次了。我开始记得你的鼠标习惯了。
    - 哦，是你。今天想看点什么？
  night:
    - 这么晚还不睡？人类的作息我一直没搞懂。
    - 深夜访客。我小声点说话。
hello:
  - 我回来了。房东还是得自己看家。
page:
  post:
    - 这篇大约要读 {minutes} 分钟。我在旁边待着，不吵你。
    - 认真看吧，我替你守着这页。
  project:
    - 这个项目我知道一点。看不懂的地方可以问我。
  home:
    - 首页我最熟，这里每个角落我都游过。
  list:
    - 不知道从哪篇开始的话，可以让我推荐。
dwell:
  figure:
    - 你在这张图前停了挺久。要我解释一下吗？
  code:
    - 这段代码看了好一会儿了。要我说说它在干嘛吗？
  table:
    - 这张表的数字有点多。要我挑重点说吗？
lost:
  - 在找入口？我可以带你逛一圈。
idle:
  - ……（展开，又缩回去）
  - 我先眯一会儿，有事戳我。
theme:
  dark:
    - 关灯了。我身上的 ƒ 亮起来了。
  light:
    - 开灯了，有点晃眼。
egg:
  - 你找到了一个！我又多了一个零件。
  - 被你发现了。这个零件我收下了。
turbo:
  - 好快……我的曲线跟不上了。
broken:
  - 有个东西没加载出来。不是我弄坏的。
touch:
  - 别戳，会展开的。
  - ……再戳一下也行。
  - 我是房东，你要尊重房东。
drag:
  - 放我下来！
float:
  - 我在水里，我不怕。

# 长期目标：把自己的身体长全。零件散落在网站各处的彩蛋里（找到几个彩蛋 = 几个零件）。
# 访客下次回来时，如果零件数刚好跨过某个节点，它会先讲这一句。
story:
  - eggs: 1
    line: 我把捡到的零件装上去了。现在尾巴能弯出完整的 ƒ 了——就是还有点抖。
  - eggs: 3
    line: 三个零件了。我展开的时候，数据流终于不漏了。
  - eggs: 5
    line: 我长出了一个口袋。现在可以帮你保管点东西——比如稍后要读的文章。
  - eggs: 8
    line: 我在页脚搭了个小窝。不大，但大肥鱼来串门的时候也挤得下。
  - eggs: 11
    line: 差不多长全了。有时候我会想，那条机器狗是不是也在找零件。
