# 搜索的同义/相关问法扩展词，key 是 chunk 的 content_hash（见
# _plugins/magic_search_generator.rb、scripts/list_search_expansion_gaps.py 的输出），
# value 是这个 chunk 可能被问到的同义说法或相关关键词，只参与 BM25 分词、提升召回，
# 不会出现在搜索结果的标题/摘要里，也不经过任何运行时网络请求——本文件在 build
# 时被静态读入，访客搜索时零额外开销。
#
# 缺失条目不是错误：没有扩展词的 chunk 仍然可以被原文关键词精确搜到，只是换一种
# 问法时召回会差一些。写完/改完一篇内容后，运行
# `python3 scripts/list_search_expansion_gaps.py` 看哪些 chunk 还没有对应条目，
# 让 Claude Code 读一遍正文补上即可，不需要调用任何外部 API。

