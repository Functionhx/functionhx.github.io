# 网站宠物的公共设定与台词（assets/js/pet.js 读取，构建时输出为 /assets/pet/lines.json）。
# 每只宠物自己的性格台词在 _data/pets/<id>.yml（输出为 /assets/pet/<id>/lines.json），会覆盖这里的同名条目。
#
# 这里只放「性格」：打招呼、反应、摸鱼、讲自己的故事。关于站长、文章和项目的事实，一律由浏览器读取
# /api/*.json，或交给大脑（pet-brain/）检索站内内容后回答，不写在这里，免得和网页说法不一致。
# 占位符：{name} 它的名字（访客起的小名优先）· {visits} 第几次来 · {title} {section} 文章与小节 · {minutes} 阅读分钟数
#         {model} 这次替它回答的模型（DeepSeek、Anthropic……）
# 写台词的边界：不冒充站长；不催访客每天来；访客离开不卖惨、不责怪；不提信的暗号。

# 默认出场的宠物，以及「换一只」里的顺序。只有在 _data/pets/<id>.yml 登记了授权形象（sprites）的才会对访客出现；
# 用 ?pet=on 预览时全部出现（没有形象的用内置占位形象）。
default: f01
roster: [f01, deepseek, claude, chatgpt, gemini]

disclosure: 和我聊天的内容会发送给 {model} 处理，本站不保存；我记得的事只存在你这台设备的浏览器里。
disclosure_unknown: 和我聊天的内容会发送给模型服务商处理（每条回答下面标着是哪家），本站不保存；我记得的事只存在你这台设备的浏览器里。
disclosure_local: 我的大脑还没接上，现在的回答来自站内搜索，什么都不会发出去；我记得的事只存在你这台设备的浏览器里。
ai_label: AI 生成
stand_in_label: 代班
credit_label: 同人角色 · 形象已获授权

greet:
  unfinished:
    - 上次你看到《{title}》的「{section}」就走了。要接着看吗？

quiet:
  - 好，我安静。想找我就点边上那个小标签。
forgot:
  - ……你是谁？开个玩笑。刚才的事我已经忘干净了。
offline:
  - 我的大脑现在连不上，只能用自带的话回答你。
budget:
  - 今天话说太多，脑子发烫了，明天再聊。我自带的那些话还是可以说的。
rate:
  - 说太快了，让我喘口气，过一会儿再问。
unknown:
  - 这个我不知道，不想编。可以去「{section}」翻翻。
letter: 那不是一道题。知道的人自然会知道。
not_owner: 我不是站长，我只是住在这里。
switch_prompt: 想换谁来陪你？
switch_back: 好，换班。我去隔壁待着，想我了再叫我。

# 点它之后的快捷按钮（顺序即显示顺序）。switch 只在能换的宠物多于一只时出现；costume 只在它有已解锁的换装时出现。
menu:
  - { id: intro, label: 介绍一下站长 }
  - { id: latest, label: 最新文章 }
  - { id: project, label: 推荐一个项目 }
  - { id: tour, label: 带我逛逛 }
  - { id: top, label: 回到顶部 }
  - { id: theme, label: 切换深浅色 }
  - { id: memory, label: 你记得我什么 }
  - { id: name, label: 给你起个名字 }
  - { id: switch, label: 换一只 }
  - { id: costume, label: 换衣服 }
  - { id: quiet, label: 安静一会儿 }
