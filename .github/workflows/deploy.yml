name: Build and deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate source content
        run: python scripts/validate_content.py

      - name: Check formatting
        run: npm run lint:prettier

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Validate built site
        run: python scripts/check_built_site.py _site

      - name: Add deployment health metadata
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "commit": os.environ["GITHUB_SHA"],
              "built_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("_site/healthz.json").write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Upload mirror artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: _site
          if-no-files-found: error
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-tencent:
    name: Deploy Tencent Cloud mirror
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: _site

      - name: Configure deploy key
        env:
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$TENCENT_SSH_KEY" > "$HOME/.ssh/tencent_site_deploy"
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tencent_site_deploy" "$HOME/.ssh/known_hosts"

      - name: Publish mirror atomically
        env:
          DEPLOY_HOST: 82.157.7.183
          DEPLOY_USER: site-deploy
          DEPLOY_ROOT: /var/www/functionhx
        run: |
          release="$DEPLOY_ROOT/releases/$GITHUB_SHA"
          ssh -i "$HOME/.ssh/tencent_site_deploy" "$DEPLOY_USER@$DEPLOY_HOST" \
            "if [ ! -d '$release' ]; then \
               mkdir -p '$release'; \
               if [ -d '$DEPLOY_ROOT/current' ]; then \
                 cp -al '$DEPLOY_ROOT/current/.' '$release/'; \
               fi; \
             fi"
          rsync -rlptDz --checksum --delete --chmod=D755,F644 \
            -e "ssh -i $HOME/.ssh/tencent_site_deploy" \
            _site/ "$DEPLOY_USER@$DEPLOY_HOST:$release/"
          ssh -i "$HOME/.ssh/tencent_site_deploy" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -s '$release/index.html' && \
             test -s '$release/healthz.json' && \
             ln -sfn 'releases/$GITHUB_SHA' '$DEPLOY_ROOT/current.next' && \
             mv -Tf '$DEPLOY_ROOT/current.next' '$DEPLOY_ROOT/current'"

      - name: Verify Tencent Cloud mirror
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 \
            https://fanyuchen.com.cn/healthz.json | python -c 'import json,sys; print(json.load(sys.stdin)["commit"])')"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Refresh semantic retrieval index
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 \
            https://fanyuchen.com.cn/api/magic-search/health >/dev/null
